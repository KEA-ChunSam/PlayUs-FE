name: Deploy React App

on:
  push:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests
        run: npm run test

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_DIR: build
      BASTION_HOST: ${{ secrets.BASTION_HOST }}
      BASTION_USER: ${{ secrets.BASTION_USER }}
      BASTION_KEY: ${{ secrets.BASTION_KEY }}
      WEB_SERVER: ${{ secrets.WEB_SERVER }}
      WEB_DIR: /var/www/html
      WEB_BACKUP_DIR: /var/www/backups
      NODE_ENV: development
      DEPLOY_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Generate .env from REACT_DEVELOP_JSON
        run: |
          echo '${{ secrets.REACT_DEVELOP_JSON }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env
          echo "REACT_APP_VERSION=${{ env.DEPLOY_VERSION }}" >> .env
          echo "REACT_APP_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env
          echo ".env 파일 생성 완료"
          echo "생성된 환경 변수 목록:"
          cat .env | sed 's/=.*/=***/' | sed 's/^/   - /'

      - name: Build app
        run: npm run build

      - name: Create version file
        run: |
          echo "{\"version\": \"${{ env.DEPLOY_VERSION }}\", \"deployedAt\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > $APP_DIR/version.json

      - name: Create SSH key
        run: |
          echo "${{ env.BASTION_KEY }}" > private_key
          chmod 600 private_key

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.BASTION_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ env.WEB_SERVER }} >> ~/.ssh/known_hosts

      - name: Deploy to Web Server via Bastion
        run: |
          ssh -i private_key -o ProxyJump=${{ env.BASTION_USER }}@${{ env.BASTION_HOST }} ${{ env.WEB_SERVER }} "
            mkdir -p /home/ubuntu/deploy
            mkdir -p $WEB_BACKUP_DIR
            BACKUP_DIR=$WEB_BACKUP_DIR/backup_$(date +%Y%m%d_%H%M%S)
            mkdir -p \$BACKUP_DIR
            cp -r $WEB_DIR/* \$BACKUP_DIR/ 2>/dev/null || true
            echo \$BACKUP_DIR > /tmp/latest_backup
          "

          rsync -avz --delete -e "ssh -i private_key -o ProxyJump=${{ env.BASTION_USER }}@${{ env.BASTION_HOST }}" \
          $APP_DIR/ ${{ env.WEB_SERVER }}:/home/ubuntu/deploy/

          ssh -i private_key -o ProxyJump=${{ env.BASTION_USER }}@${{ env.BASTION_HOST }} ${{ env.WEB_SERVER }} "
            mv /home/ubuntu/deploy/* $WEB_DIR/
            rm -rf /home/ubuntu/deploy
            sudo systemctl restart nginx
          "

      - name: Verify Nginx status
        run: |
          ssh -i private_key -o ProxyJump=${{ env.BASTION_USER }}@${{ env.BASTION_HOST }} \
          ${{ env.WEB_SERVER }} 'sudo systemctl is-active nginx || (echo "Nginx is not running" && exit 1)'
          ssh -i private_key -o ProxyJump=${{ env.BASTION_USER }}@${{ env.BASTION_HOST }} \
          ${{ env.WEB_SERVER }} 'sudo nginx -t || (echo "Nginx configuration test failed" && exit 1)'

      - name: Health check
        run: |
          for i in {1..5}; do
            if curl -f ${{ secrets.APP_URL }}/version.json; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Health check failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i private_key -o ProxyJump=${{ env.BASTION_USER }}@${{ env.BASTION_HOST }} \
          ${{ env.WEB_SERVER }} "
            LATEST_BACKUP=\$(ls -t $WEB_BACKUP_DIR/backup_* 2>/dev/null | head -n1)
            if [ ! -z \"\$LATEST_BACKUP\" ]; then
              cp -r \$LATEST_BACKUP/* $WEB_DIR/
              sudo systemctl restart nginx
              echo 'Rollback completed to backup: '\$LATEST_BACKUP
            else
              echo 'No backup found for rollback'
              exit 1
            fi
          "

      - name: Clean old backups
        if: success()
        run: |
          ssh -i private_key -o ProxyJump=${{ env.BASTION_USER }}@${{ env.BASTION_HOST }} \
          ${{ env.WEB_SERVER }} "find $WEB_BACKUP_DIR/backup_* -maxdepth 0 -mtime +7 -exec rm -rf {} \; 2>/dev/null || true"

      - name: Clean up
        if: always()
        run: rm -f private_key

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            COLOR="#36a64f"
            EMOJI="✅"
            STATUS="성공"
          else
            COLOR="#ff0000"
            EMOJI="❌"
            STATUS="실패"
          fi

          COMMIT_MESSAGE=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/"/\\"/g')
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
          DEPLOY_TIME=$(date '+%Y-%m-%d %H:%M:%S KST')

          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "${COLOR}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${EMOJI} PlayUs 배포 ${STATUS}",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*버전:*\n${COMMIT_SHA_SHORT}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*배포 시간:*\n${DEPLOY_TIME}"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*커밋 메시지:*\n${COMMIT_MESSAGE}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*작성자:*\n${COMMIT_AUTHOR}"
                      }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*배포 환경:*\n${NODE_ENV}"
                    }
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|배포 상세 정보 보기>"
                      }
                    ]
                  }
                ]
              }
            ]
          }
EOF
          )

          curl -X POST -H 'Content-type: application/json' \
            --data "${PAYLOAD}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
